<title>CRM Papelerías de Barrio</title>

<!-- PWA: manifest, tema e íconos -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B4570">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM Papelería">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-apple-touch.png">
<style>
  :root{
    --paper:#F7F2E9;
    --paper-dark:#EFE6D3;
    --ink:#242B33;
    --navy:#2B4570;
    --navy-dark:#1D3050;
    --stamp:#B5482A;
    --line:#D9CDB4;
    --ok:#3F7D58;
    --warn:#B5482A;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    min-height:100vh;
  }
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif; margin:0;}
  a{color:inherit;}

  /* ---- Sidebar ---- */
  #sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--navy);
    color:var(--white);
    display:flex;
    flex-direction:column;
    padding:24px 0;
  }
  #brand{
    padding:0 20px 20px 20px;
    border-bottom:1px solid rgba(255,255,255,.15);
    margin-bottom:14px;
  }
  #brand h1{font-size:19px; line-height:1.25; color:var(--white);}
  #brand .sub{font-size:11px; letter-spacing:.03em; color:rgba(255,255,255,.6); margin-top:4px;}
  #storeNameField{
    width:100%; margin-top:10px; padding:6px 8px; font-size:12px;
    border:1px solid rgba(255,255,255,.3); border-radius:3px;
    background:rgba(255,255,255,.08); color:var(--white);
  }
  #storeNameField::placeholder{color:rgba(255,255,255,.5);}

  nav{display:flex; flex-direction:column; gap:2px; padding:0 10px;}
  nav button{
    all:unset;
    cursor:pointer;
    padding:11px 14px;
    border-radius:6px;
    font-size:14.5px;
    display:flex;
    align-items:center;
    gap:10px;
    color:rgba(255,255,255,.82);
    position:relative;
  }
  nav button svg{width:17px; height:17px; flex-shrink:0; opacity:.85;}
  nav button.active svg{opacity:1;}
  nav button .tag{
    font-size:10px; font-variant-numeric:tabular-nums;
    color:rgba(255,255,255,.4); width:18px;
  }
  nav button:hover{background:rgba(255,255,255,.08); color:var(--white);}
  nav button.active{background:var(--white); color:var(--navy); font-weight:600;}
  nav button.active .tag{color:var(--stamp);}

  #sidebarFoot{margin-top:auto; padding:14px 20px 0 20px; font-size:11px; color:rgba(255,255,255,.45); border-top:1px solid rgba(255,255,255,.12);}

  /* ---- Main ---- */
  #main{flex:1; padding:34px 42px; max-width:1180px;}
  .pagehead{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; border-bottom:2px solid var(--ink); padding-bottom:12px;}
  .pagehead h2{font-size:26px;}
  .pagehead .desc{font-size:13px; color:#6b6155; margin-top:4px; font-family:-apple-system,sans-serif;}

  .grid{display:grid; gap:18px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-2{grid-template-columns:1.1fr .9fr;}

  .card{background:var(--white); border:1px solid var(--line); border-radius:8px; padding:18px 20px;}
  .stat .num{font-size:30px; font-weight:700; font-family:Georgia,serif; color:var(--navy);}
  .stat .label{font-size:12px; color:#847a6b; margin-top:2px;}
  .stat.alert .num{color:var(--stamp);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#8a8072; padding:8px 10px; border-bottom:2px solid var(--ink);}
  td{padding:9px 10px; border-bottom:1px solid var(--line);}
  tr:hover td{background:var(--paper-dark);}
  .pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;}
  .pill.ok{background:#E4EFE8; color:var(--ok);}
  .pill.warn{background:#F5E3DC; color:var(--stamp);}
  .pill.neutral{background:#EFE9DD; color:#7a705f;}

  .btn{
    all:unset; cursor:pointer; background:var(--navy); color:var(--white);
    padding:9px 16px; border-radius:6px; font-size:13.5px; font-weight:600;
  }
  .btn:hover{background:var(--navy-dark);}
  .btn.secondary{background:transparent; color:var(--navy); border:1px solid var(--navy);}
  .btn.secondary:hover{background:var(--navy); color:var(--white);}
  .btn.danger{background:transparent; color:var(--stamp); border:1px solid var(--stamp); padding:5px 10px; font-size:12px;}
  .btn.danger:hover{background:var(--stamp); color:var(--white);}
  .btn.small{padding:5px 10px; font-size:12px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px;}
  .toolbar input[type=text]{flex:1; max-width:280px;}

  input,select,textarea{
    font-family:inherit; font-size:13.5px; padding:8px 10px;
    border:1px solid var(--line); border-radius:5px; background:var(--white); color:var(--ink);
  }
  label{font-size:12px; font-weight:600; color:#5c5445; display:block; margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(36,43,51,.45); display:none; align-items:center; justify-content:center; z-index:50;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--white); border-radius:10px; padding:26px 28px; width:460px; max-width:92vw; max-height:88vh; overflow:auto; box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal h3{margin-bottom:16px; font-size:19px;}
  .modal .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  .empty{padding:40px 20px; text-align:center; color:#9a8f7c; font-size:13.5px; border:1px dashed var(--line); border-radius:8px;}
  .muted{color:#8a8072; font-size:12px;}
  .section-note{font-size:12px; color:#7a705f; background:var(--paper-dark); border-radius:6px; padding:10px 12px; margin-bottom:16px;}
  .calc-result{font-family:Georgia,serif; font-size:22px; color:var(--navy); margin-top:6px;}
  .toast{position:fixed; bottom:24px; right:24px; background:var(--ink); color:var(--white); padding:12px 18px; border-radius:6px; font-size:13px; opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none; z-index:100;}
  .toast.show{opacity:1; transform:translateY(0);}

  /* ---- Charts (CSS puro, sin librerías, funciona offline) ---- */
  .chart-bars{display:flex; align-items:flex-end; gap:14px; padding-top:6px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .bar-value{font-size:10.5px; color:#8a8072; margin-bottom:4px; white-space:nowrap;}
  .bar{width:100%; max-width:34px; background:var(--navy); border-radius:4px 4px 0 0; min-height:3px; transition:height .3s;}
  .bar-label{font-size:11px; color:#7a705f; margin-top:6px; text-transform:capitalize;}

  .chart-hbars{display:flex; flex-direction:column; gap:12px;}
  .hbar-row{display:grid; grid-template-columns:120px 1fr 30px; align-items:center; gap:10px;}
  .hbar-label{font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hbar-track{background:var(--paper-dark); border-radius:5px; height:12px; overflow:hidden;}
  .hbar-fill{background:var(--stamp); height:100%; border-radius:5px; transition:width .3s;}
  .hbar-value{font-size:12px; font-weight:600; color:#5c5445; text-align:right;}

  .donut{width:130px; height:130px; border-radius:50%; position:relative; flex-shrink:0;}
  .donut-hole{position:absolute; inset:18px; background:var(--white); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .donut-total{font-family:Georgia,serif; font-size:22px; font-weight:700; color:var(--navy); line-height:1;}
  .donut-sub{font-size:10px; color:#8a8072; margin-top:2px;}
  .legend{display:flex; flex-direction:column; gap:8px;}
  .legend-item{font-size:13px; color:#5c5445; display:flex; align-items:center; gap:8px;}
  .legend-item b{color:var(--ink); margin-left:2px;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}

  /* ---- Utilidades de tabla y filtros ---- */
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  th.sortable{cursor:pointer; user-select:none;}
  th.sortable:hover{color:var(--navy);}
  th.sortable .arrow{font-size:9px; margin-left:3px; opacity:.6;}
  .clickable-row{cursor:pointer;}
  .filters-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  .filters-row select, .filters-row input[type=date]{font-size:13px;}
  .load-more-wrap{text-align:center; margin-top:14px;}

  /* =========================================================
     RESPONSIVO — celular (< 768px): la barra lateral se
     convierte en barra superior + navegación horizontal.
     ========================================================= */
  @media (max-width: 768px){
    body{flex-direction:column;}
    #sidebar{
      width:100%; flex-direction:row; align-items:center;
      padding:10px 8px; position:sticky; top:0; z-index:40;
    }
    #brand{
      border-bottom:none; margin-bottom:0; padding:0 10px 0 4px;
      flex-shrink:0; display:flex; flex-direction:column; justify-content:center;
    }
    #brand h1{font-size:15px;}
    #brand .sub, #storeNameField{display:none;}
    nav{flex-direction:row; padding:0; gap:2px; overflow-x:auto; flex:1;}
    nav button{flex-direction:column; gap:2px; padding:7px 8px; font-size:9.5px; white-space:nowrap;}
    nav button .tag{display:none;}
    nav button svg{width:19px; height:19px;}
    #sidebarFoot{display:none;}
    #main{padding:18px 14px 40px 14px;}
    .pagehead{flex-direction:column; align-items:flex-start; gap:10px;}
    .pagehead h2{font-size:21px;}
    .grid.cols-4{grid-template-columns:repeat(2,1fr);}
    .grid.cols-2{grid-template-columns:1fr;}
    .modal{width:100%; max-width:100vw; height:100%; max-height:100vh; border-radius:0; padding:20px 18px;}
    .modal-backdrop.open{align-items:stretch; justify-content:stretch;}
    .form-grid{grid-template-columns:1fr;}
    table{font-size:12.5px;}
    th,td{padding:8px 6px;}
    .toast{left:14px; right:14px; bottom:20px; text-align:center;}
    .filters-row{flex-direction:column; align-items:stretch;}
  }

  /* =========================================================
     LOGIN — pantalla de selección de usuario (control organizacional)
     ========================================================= */
  #loginScreen{
    position:fixed; inset:0; background:var(--navy); display:flex;
    align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  #loginScreen.hidden{display:none;}
  .login-card{
    background:var(--white); border-radius:14px; padding:32px 28px; width:340px; max-width:100%;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .login-icon{
    width:52px; height:52px; border-radius:50%; background:var(--navy); color:var(--white);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px auto;
  }
  .login-card h1{font-size:19px; margin-bottom:4px;}
  .login-sub{font-size:12.5px; color:#8a8072; margin-bottom:18px;}
  .login-user-btn{
    all:unset; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px;
    font-size:14px; color:var(--ink); box-sizing:border-box;
  }
  .login-user-btn:hover{border-color:var(--navy); background:var(--paper-dark);}
  .login-user-btn .rol-pill{font-size:10px; padding:2px 8px; border-radius:20px; background:var(--paper-dark); color:#7a705f;}
  .login-note{font-size:10.5px; color:#a89e8c; margin-top:16px; line-height:1.4;}

  #userBadge{padding:12px 20px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:6px;}
  #userBadge .u-name{font-size:12.5px; color:var(--white); font-weight:600;}
  #userBadge .u-rol{font-size:10.5px; color:rgba(255,255,255,.55); text-transform:capitalize;}
  #userBadge button{
    all:unset; cursor:pointer; font-size:10.5px; color:rgba(255,255,255,.6); margin-top:4px;
    text-decoration:underline;
  }
  #userBadge button:hover{color:var(--white);}
  @media (max-width:768px){
    #userBadge{
      display:flex; align-items:center; border-bottom:none; margin-bottom:0;
      padding:0 6px; flex-shrink:0;
    }
    #userBadge .u-name, #userBadge .u-rol{display:none;}
    #userBadge button{font-size:10px; text-decoration:none; background:rgba(255,255,255,.12); padding:6px 9px; border-radius:6px;}
  }
</style>
</head>

    <div class="login-note">Este acceso organiza el trabajo del equipo (quién hizo qué). No sustituye la seguridad de un sistema con servidor.</div>

<div id="sidebar">

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBody"></div></div>

function loadDB(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){ const seeded = seedData(); localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded)); return seeded; }
  let data;
  try{ data = JSON.parse(raw); } catch(e){ const seeded = seedData(); localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded)); return seeded; }
  return migrateDB(data);
}
// Migra datos guardados de versiones anteriores del CRM que no tenían
// usuarios/proveedores/órdenes de compra, sin perder la información ya cargada.
function migrateDB(data){
  const defaults = seedData();
  let changed = false;
  ["usuarios","proveedores","ordenes_compra"].forEach(key=>{
    if(!Array.isArray(data[key])){ data[key] = defaults[key]; changed = true; }
  });
  if(!data.nextIds) data.nextIds = {};
  Object.keys(defaults.nextIds).forEach(k=>{
    if(data.nextIds[k]==null){ data.nextIds[k] = defaults.nextIds[k]; changed = true; }
  });
  if(!data.config){ data.config = defaults.config; changed = true; }
  if(changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  return data;
}

function money(n){ return "$" + Number(n||0).toLocaleString("es-CO"); }
function fmtDate(d){ if(!d) return "—"; const [y,m,day]=d.split("-"); return `${day}/${m}/${y}`; }
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}
function calcEOQ(D,S,H){ if(!D||!S||!H) return null; return Math.sqrt((2*D*S)/H); }
function calcROP(demandaDiaria,tiempoEntrega,z,sigma){
  if(demandaDiaria==null||tiempoEntrega==null) return null;
  const ss = (z!=null && sigma!=null) ? z*sigma*Math.sqrt(tiempoEntrega) : 0;
  return (demandaDiaria*tiempoEntrega) + ss;
}

  const pin = document.getElementById("loginPinInput").value;
  const u = db.usuarios.find(x=>x.id===loginSelectedUser);
  if(u && String(u.pin)===String(pin)){ setSession(u.id); hideLoginScreen(); bootAppAfterLogin(); }
  else { toast("PIN incorrecto"); }
}

function last7Days(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}
function buildVerticalBars(items, maxHeight=130){
  const max = Math.max(1, ...items.map(i=>i.value));
  return `
    <div class="chart-bars" style="height:${maxHeight}px;">
      ${items.map(i=>{
        const h = Math.round((i.value/max)*100);
        return `<div class="bar-col">
          <div class="bar-value">${i.value?money(i.value):''}</div>
          <div class="bar" style="height:${h}%;"></div>
          <div class="bar-label">${i.label}</div>
        </div>`;
      }).join("")}
    </div>`;
}
function buildHorizontalBars(items){
  const max = Math.max(1, ...items.map(i=>i.value));
  return `
    <div class="chart-hbars">
      ${items.map(i=>{
        const w = Math.round((i.value/max)*100);
        return `<div class="hbar-row">
          <div class="hbar-label" title="${i.label}">${i.label}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${w}%;"></div></div>
          <div class="hbar-value">${i.value}</div>
        </div>`;
      }).join("")}
    </div>`;
}
function buildDonut(segments){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let acc = 0;
  const stops = segments.map(s=>{
    const start = (acc/total)*100; acc+=s.value; const end=(acc/total)*100;
    return `${s.color} ${start}% ${end}%`;
  }).join(", ");
  return `
    <div style="display:flex; align-items:center; gap:22px;">
      <div class="donut" style="background:conic-gradient(${stops});">
        <div class="donut-hole"><div class="donut-total">${total}</div><div class="donut-sub">clientes</div></div>
      </div>
      <div class="legend">
        ${segments.map(s=>`<div class="legend-item"><span class="dot" style="background:${s.color}"></span>${s.label} <b>${s.value}</b></div>`).join("")}
      </div>
    </div>`;
}

  const dias = last7Days();

  })).filter(s=>s.value>0);

  main.innerHTML = `

      <div class="card stat"><div class="num">${money(ticketProm)}</div><div class="label">Ticket promedio</div></div>
      <div class="card stat ${bajoStock.length?'alert':''}"><div class="num">${bajoStock.length}</div><div class="label">Alertas de stock</div></div>
    </div>

    <div class="grid cols-2" style="margin-bottom:18px;">
      <div class="card">
        <h3 style="font-size:15px; margin-bottom:14px;">Ventas — últimos 7 días</h3>
        ${db.ventas.length ? buildVerticalBars(ventasPorDia) : `<div class="empty">Aún no hay ventas registradas para graficar.</div>`}
      </div>
      <div class="card">
        <h3 style="font-size:15px; margin-bottom:14px;">Clientes por segmento</h3>
        ${db.clientes.length ? buildDonut(segmentos) : `<div class="empty">No hay clientes registrados.</div>`}
      </div>
    </div>

    <div class="grid cols-2">
      <div class="card">
        <h3 style="font-size:15px; margin-bottom:14px;">Productos más vendidos</h3>
        ${topProductos.length ? buildHorizontalBars(topProductos) : `<div class="empty">Aún no hay ventas registradas.</div>`}
      </div>
      <div class="card">
        <h3 style="font-size:15px; margin-bottom:10px;">Pendientes</h3>
        <div class="muted" style="margin-bottom:8px;">${bajoStock.length} producto(s) por reabastecer · ${pqrAbiertos.length} PQR abierto(s)</div>
        ${bajoStock.length ? `<table><thead><tr><th>Producto</th><th>Stock</th></tr></thead><tbody>${bajoStock.slice(0,4).map(p=>`<tr><td>${p.nombre}</td><td>${p.stock_actual}/${p.stock_minimo}</td></tr>`).join("")}</tbody></table>` : ""}
        ${pqrAbiertos.length ? `<table style="margin-top:10px;"><thead><tr><th>Cliente</th><th>Tipo</th></tr></thead><tbody>${pqrAbiertos.slice(0,4).map(p=>`<tr><td>${clienteNombre(p.id_cliente)}</td><td style="text-transform:capitalize">${p.tipo}</td></tr>`).join("")}</tbody></table>` : ""}
        ${(!bajoStock.length && !pqrAbiertos.length) ? `<div class="empty">Todo al día — sin pendientes.</div>` : ""}
      </div>
    </div>
  `;
}

let productoSort = {key:"nombre", dir:1};
function sortProductoBy(key){
  if(productoSort.key===key) productoSort.dir*=-1; else { productoSort.key=key; productoSort.dir=1; }
  renderProductosTable();
}
function renderProductosTable(){
  const wrap = document.getElementById("productosTableWrap");
  const q = (document.getElementById("searchProducto")?.value || "").toLowerCase();
  const cat = document.getElementById("filterCategoria")?.value || "";
  const stockFilter = document.getElementById("filterStock")?.value || "";
  let list = db.productos.filter(p=>{
    if(q && !p.nombre.toLowerCase().includes(q)) return false;
    if(cat && p.categoria!==cat) return false;
    if(stockFilter==="bajo" && p.stock_actual>p.stock_minimo) return false;
    return true;
  });
  const {key,dir} = productoSort;
  list = [...list].sort((a,b)=>{
    const av=a[key], bv=b[key];
    if(typeof av==="number") return (av-bv)*dir;
    return String(av).localeCompare(String(bv))*dir;
  });
  if(!list.length){ wrap.innerHTML = `<div class="empty">No hay productos que coincidan con el filtro.</div>`; return; }
  const arrow = k => productoSort.key===k ? `<span class="arrow">${productoSort.dir===1?'▲':'▼'}</span>` : '';
  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th class="sortable" onclick="sortProductoBy('nombre')">Producto${arrow('nombre')}</th>
        <th class="sortable" onclick="sortProductoBy('categoria')">Categoría${arrow('categoria')}</th>
        <th>Proveedor</th>
        <th class="sortable" onclick="sortProductoBy('precio_venta')">Precio venta${arrow('precio_venta')}</th>
        <th class="sortable" onclick="sortProductoBy('stock_actual')">Stock${arrow('stock_actual')}</th>
        <th>Estado</th><th></th>
      </tr></thead>
      <tbody>
        ${list.map(p=>{
          const bajo = p.stock_actual<=p.stock_minimo;
          return `<tr>
            <td>${p.nombre}</td>
            <td>${p.categoria}</td>
            <td>${p.id_proveedor ? proveedorNombre(p.id_proveedor) : '<span class="muted">Sin asignar</span>'}</td>
            <td>${money(p.precio_venta)}</td>
            <td>${p.stock_actual} ${p.unidad}</td>
            <td><span class="pill ${bajo?'warn':'ok'}">${bajo?'Reabastecer':'OK'}</span></td>
            <td style="text-align:right; white-space:nowrap;">
              ${isOwner() ? `
                <button class="btn secondary small" onclick="openProductoForm(${p.id})">Editar</button>
                <button class="btn danger" onclick="deleteProducto(${p.id})">Eliminar</button>
              ` : `<span class="muted">Solo lectura</span>`}
            </td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>`;
}

function autofillCalc(){
  const pid = Number(document.getElementById("calc_producto").value);
  if(!pid) return;
  const prod = db.productos.find(p=>p.id===pid);
  if(!prod) return;
  const ventasDelProducto = db.ventas.flatMap(v=>v.items.filter(i=>i.id===pid).map(i=>({fecha:v.fecha, cantidad:i.cantidad})));
  const unidadesVendidas = ventasDelProducto.reduce((s,v)=>s+v.cantidad,0);
  const fechas = db.ventas.map(v=>v.fecha).sort();
  const diasCubiertos = fechas.length ? Math.max(1, Math.round((new Date(fechas[fechas.length-1]) - new Date(fechas[0]))/86400000)) : 1;
  const demandaDiaria = unidadesVendidas / diasCubiertos;
  document.getElementById("rop_dd").value = Math.round(demandaDiaria*10)/10;
  document.getElementById("eoq_D").value = Math.round(demandaDiaria*365);
  if(prod.id_proveedor){
    const prov = db.proveedores.find(p=>p.id===prod.id_proveedor);
    if(prov) document.getElementById("rop_lt").value = prov.tiempo_entrega_dias;
  }
  toast("Datos autocompletados desde el historial y el proveedor");
}
function runCalc(){
  const D=Number(document.getElementById("eoq_D").value)||null;
  const S=Number(document.getElementById("eoq_S").value)||null;
  const H=Number(document.getElementById("eoq_H").value)||null;
  const dd=Number(document.getElementById("rop_dd").value)||null;
  const lt=Number(document.getElementById("rop_lt").value)||null;
  const sigma=Number(document.getElementById("rop_sigma").value)||null;
  const z=Number(document.getElementById("rop_z").value);
  const eoq = calcEOQ(D,S,H);
  const rop = calcROP(dd,lt,z,sigma);
  document.getElementById("calcOut").innerHTML = `
    ${eoq!=null ? `<div class="calc-result">EOQ ≈ ${Math.round(eoq)} unidades por pedido</div>` : `<div class="muted">Completa D, S y H para calcular el EOQ.</div>`}
    ${rop!=null ? `<div class="calc-result">ROP ≈ ${Math.round(rop)} unidades (punto de reorden)</div>` : `<div class="muted">Completa demanda diaria y tiempo de entrega para calcular el ROP.</div>`}
  `;
}

function renderPqrTable(){
  const wrap = document.getElementById("pqrTableWrap");
  if(!db.pqrs.length){ wrap.innerHTML = `<div class="empty">No hay registros de PQR.</div>`; return; }
  function diasRespuesta(p){
    if(!p.fecha_cierre) return null;
    const ms = new Date(p.fecha_cierre) - new Date(p.fecha_apertura);
    return Math.max(0, Math.round(ms/86400000));
  }
  const cerrados = db.pqrs.filter(p=>p.fecha_cierre);
  const promedioDias = cerrados.length ? Math.round(cerrados.reduce((s,p)=>s+diasRespuesta(p),0)/cerrados.length) : null;
  wrap.innerHTML = `
    ${promedioDias!=null ? `<div class="section-note" style="margin:14px;">Tiempo de respuesta promedio (SLA): <b>${promedioDias} día(s)</b> sobre ${cerrados.length} PQR cerrados.</div>` : ""}
    <table>
      <thead><tr><th>Cliente</th><th>Tipo</th><th>Descripción</th><th>Apertura</th><th>Estado</th><th>Respuesta</th><th>Registrado por</th><th></th></tr></thead>
      <tbody>
        ${[...db.pqrs].sort((a,b)=>b.id-a.id).map(p=>{
          const dias = diasRespuesta(p);
          return `<tr>
            <td>${clienteNombre(p.id_cliente)}</td>
            <td style="text-transform:capitalize">${p.tipo}</td>
            <td>${p.descripcion}</td>
            <td>${fmtDate(p.fecha_apertura)}</td>
            <td><span class="pill ${p.estado==='cerrado'?'ok':'warn'}">${p.estado}</span></td>
            <td>${dias!=null ? dias+" día(s)" : "—"}</td>
            <td class="muted">${p.id_usuario?usuarioNombre(p.id_usuario):"—"}</td>
            <td style="text-align:right;">
              ${p.estado==='abierto' ? `<button class="btn secondary small" onclick="cerrarPqr(${p.id})">Marcar cerrado</button>` : ""}
            </td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>`;
}

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(v=>{
    const s = String(v??"");
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast("Archivo descargado: "+filename);
}
function exportVentasCSV(){
  const rows = [["ID","Fecha","Cliente","Productos","Total"]];

  downloadCSV("ventas.csv", rows);
}
function exportProductosCSV(){

  db.productos.forEach(p=>rows.push([p.nombre,p.categoria,p.precio_compra,p.precio_venta,p.stock_actual,p.stock_minimo,p.proveedor]));
  downloadCSV("inventario.csv", rows);
}
function exportClientesCSV(){

  db.clientes.forEach(c=>rows.push([c.nombre,c.documento,c.telefono,c.correo,c.segmento,c.fecha_registro]));

  if(e.key==="Enter" && document.getElementById("loginPinArea") && document.getElementById("loginPinArea").style.display!=="none" && document.activeElement===document.getElementById("loginPinInput")){
    attemptLogin();
  }
});
function initApp(){
  const session = getSession();
  if(session && db.usuarios.find(u=>u.id===session.userId)){
    hideLoginScreen();
    bootAppAfterLogin();
  } else {
    showLoginScreen();
  }
}
initApp();
</script>
